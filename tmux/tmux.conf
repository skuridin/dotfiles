# ── Mouse ──────────────────────────────────────────
set -g mouse on

# ── Extended Keys (keycodes beyond F12, modifiers) ─
set -g extended-keys always
set -g extended-keys-format csi-u

# ── New windows & panes open in the current pane's directory ─
# tmux defaults these to the server's cwd; pin them to the
# active pane's path explicitly.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ── Focus Events (let programs know when a pane gains/loses focus) ─
set -g focus-events on

# ── Status bar: Tailscale connection status (left of pane title + clock) ─
set -g status-style 'bg=#{?client_prefix,red,green},fg=black'
set -g status-right-length 60
set -g status-right '#(~/.config/tmux/tailscale-status.sh) | #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

# Clipboard forwarding through SSH and nested tmux (OSC 52).
set -s set-clipboard on
# Full list mirrors tmux 3.5a defaults plus extkeys/clipboard additions;
# set -s (not -as) so reloading the config doesn't stack duplicate entries.
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,tmux*:clipboard:extkeys,screen*:title:clipboard,rxvt*:ignorefkeys'
